name: Build Hermes Assistant Package

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT_PATH: src/Files.App/Files.App.csproj
  LAUNCHER_PROJECT_PATH: src/Files.App.Launcher/Files.App.Launcher.vcxproj
  APPX_PACKAGE_DIR: D:\a\output\AppxPackages\
  APPX_SELFSIGNED_CERT_PATH: D:\a\output\AppxPackages\Files.SelfSigned.pfx

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        msbuild Files.slnx -t:Restore -p:Platform=${{ matrix.platform }} -p:Configuration=${{ matrix.configuration }} -v:quiet
        nuget install src/Files.App.Launcher/packages.config -OutputDirectory packages

    - name: Build Launcher
      shell: pwsh
      run: |
        msbuild src/Files.App.Launcher/Files.App.Launcher.vcxproj -t:Build -p:Platform=${{ matrix.platform }} -p:Configuration=${{ matrix.configuration }} -v:quiet

    - name: Create self-signed certificate matching manifest
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path (Split-Path $env:APPX_SELFSIGNED_CERT_PATH)
        ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination "$env:APPX_SELFSIGNED_CERT_PATH"

    - name: Build and Package Files MSIX
      shell: pwsh
      run: |
        msbuild src/Files.App/Files.App.csproj `
          -t:Build `
          -p:Configuration=${{ matrix.configuration }} `
          -p:Platform=${{ matrix.platform }} `
          -p:AppxBundlePlatforms=${{ matrix.platform }} `
          -p:AppxBundle=Always `
          -p:GenerateAppxPackageOnBuild=true `
          -p:UapAppxPackageBuildMode=SideloadOnly `
          -p:AppxPackageDir="$env:APPX_PACKAGE_DIR" `
          -p:AppxPackageSigningEnabled=true `
          -p:PackageCertificateKeyFile="$env:APPX_SELFSIGNED_CERT_PATH" `
          -v:quiet

    - name: Upload Installer Package (.msixbundle)
      uses: actions/upload-artifact@v4
      with:
        name: Files-Hermes-Installer-x64
        path: ${{ env.APPX_PACKAGE_DIR }}
